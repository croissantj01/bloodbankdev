{% extends 'admin/admin_base.html' %}
{% block content %}


<div class="container py-4 blood-page">

    <h1 class="report-heading">View Blood Details</h1>
    <p class="report-subtitle">View Blood Info/Inventory</p>

    <!-- Summary -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="card stat-card p-3">
                <h6>Total Units in Stock</h6>
                <h3 id="totalUnits">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card p-3">
                <h6>Blood Types</h6>
                <h3 id="typeCount">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card p-3">
                <h6>Sufficient Types</h6>
                <h3 id="sufficientCount">0</h3>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="card stat-card p-3">
                <h6>Low / Critical Types</h6>
                <h3 id="lowCount">0</h3>
            </div>
        </div>
    </div>

    <!-- Low Stock Alert -->
    <div class="alert alert-danger" id="criticalAlert" style="display:none;"></div>

    <!-- Search and Filters -->
    <div class="card p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <input type="search" id="searchBlood"
                       class="form-control"
                       placeholder="Search blood type...">
            </div>

            <div class="col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="All">All Statuses</option>
                    <option value="Sufficient">Sufficient</option>
                    <option value="Low">Low</option>
                    <option value="Critical">Critical</option>
                </select>
            </div>

            <div class="col-md-3">
                <select id="sortBlood" class="form-select">
                    <option value="desc">Quantity: High to Low</option>
                    <option value="asc">Quantity: Low to High</option>
                    <option value="type">Blood Type: A to Z</option>
                </select>
            </div>

            <div class="col-md-2">
                <button class="btn btn-secondary w-100"
                        onclick="resetFilters()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Blood Inventory Table -->
    <div class="card p-3">
        <h4>Blood Inventory</h4>


        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Blood Type</th>
                        <th>Available Units</th>
                        <th>Status</th>
                        <th>Last Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bloodTableBody"></tbody>
            </table>
        </div>

        <p id="resultCount" class="text-muted"></p>
    </div>

</div>

<!-- Blood Details Modal -->
<div class="modal fade" id="bloodModal" tabindex="-1"
     aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Blood Details</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="bloodModalBody"></div>

            <div class="modal-footer">
                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
</div>


{% endblock %}
