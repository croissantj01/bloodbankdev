{% extends "general/base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<div class="card">
    <div class="card-left">
        <img src="{{ url_for('static', filename='images/bloodbanklogin.jpg') }}" alt="Login picture">
    </div>

    <div class="card-right">
        <div class="form-container">
            <h2>Reset Password</h2>
        </div>

        <form method="POST" action="{{ url_for('reset_password') }}">
            <div class="input-group">
                <label for="new_password" class="d-flex justify-content-between align-items-center">
                    <span>Password</span>
                    <!-- Info Icon with hover/tooltip for constraints -->
                    <span class="text-muted" tabindex="0" data-bs-toggle="tooltip" data-bs-placement="right" title="Password must be at least 8 characters long and contain at least one letter and one number." style="cursor: pointer; font-size: 0.85rem;">
                        <i class="fa-solid fa-circle-info text-primary"></i>
                    </span>
                </label>
                <input type="password" id="new_password" name="new_password" required>
            </div>

            <div class="input-group">
                <label for="confirm_new_password">Confirm Password</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" required>
            </div>

            <button type="submit" class="submit-button">Update</button>
        </form>
    </div>
</div>

{% if error_popup %}
<script>
    alert("{{ error_popup }}");
</script>
{% endif %}

<!-- Bootstrap Tooltip Initialization Script -->
<script>
    document.addEventListener("DOMContentLoaded", function(){
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>

{% endblock %}
