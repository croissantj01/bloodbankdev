<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Donor Dashboard </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='donor_page.css') }}">
</head>
<body>

<nav class="navbar">
    <span class="navbar-name">
        {{ session.get('name', 'Donor') }}
    </span>
    <span class="navbar-title">
        Donor Dashboard
    </span>
</nav>

<div class="layout">

    <aside class="sidebar">
        <a href="{{ url_for('donor_dashboard') }}">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="{{ url_for('donor_edit_profile') }}">
            <i class="fas fa-user-edit"></i> Manage Profile
        </a>
        <a href="{{ url_for('booking') }}">
            <i class="fas fa-calendar-check"></i> Book Appointment
        </a>
        <a href="{{ url_for('donation_history') }}">
            <i class="fas fa-hand-holding-heart"></i> Donation history
        </a>
        <a href="{{ url_for('donorpage_faq') }}">
            <i class="fas fa-circle-question"></i> FAQ
        </a>
        <a href="{{ url_for('index') }}">
            <i class="fas fa-sign-out-alt"></i> Log out
        </a>
    </aside>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
