{% extends "blood_bank_staff/blood_bank_staff_base.html" %}
{% block title %}Record Blood Donation{% endblock %}
{% block content %}

<div class="staff-page">

    <h1>Record Blood Donation</h1>

    <p class="staff-subtitle">
        Record a donation made by a registered donor.
    </p>


<div class="donation-layout">

    <div class="donation-form-panel">

        <h2>Donation Details</h2>

        <form method="POST"
              action="{{ url_for('record_donation') }}"
              class="staff-form">

            <div class="staff-form-group">
                <label for="donor_id">Select Donor:</label>
                <select id="donor_id" name="donor_id" required>
                    <option value="">Select Donor</option>
                    {% for donor in donors %}
                    <option value="{{ donor.id }}">{{ donor.fullname }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="staff-form-group">
                <label for="blood_type">Blood Type:</label>
                <select id="blood_type" name="blood_type" required>
                    <option value="">Select Blood Type</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div class="staff-form-group">
                <label for="quantity">Quantity (Units):</label>
                <input type="number" id="quantity" name="quantity" min="1" required>
            </div>

            <div class="staff-form-group">
                <label for="remarks">Remarks:</label>
                <textarea id="remarks" name="remarks" rows="3"
                          placeholder="Enter any additional remarks (optional)"></textarea>
            </div>

            <button type="submit" class="staff-btn">
                Record Donation
            </button>

        </form>

    </div>


    <div class="donation-image">
        <img
            src="{{ url_for('static', filename='images/blooddonation.jpg') }}"
            alt="Blood donation"
        >
    </div>

</div>

</div>

{% endblock %}
