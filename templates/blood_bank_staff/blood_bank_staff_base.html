<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Blood Bank{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top nav-head">
    <div class="container">

        <a class="navbar-brand" href="{{ url_for('index') }}">
            ✦✧ Blood Bank Management System ✦✧
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#bloodBankStaffNav"
                aria-controls="bloodBankStaffNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="bloodBankStaffNav">
            <div class="floating-navbar">
                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a href="{{ url_for('blood_bank_staff_dashboard') }}" class="nav-link">
                            <i class="fa-solid fa-house"></i>
                            <span class="nav-text">Home</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{{ url_for('record_donation') }}" class="nav-link">
                            <i class="fa-solid fa-clipboard-user"></i>
                            <span class="nav-text">Record Donation</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{{ url_for('view_appointment') }}" class="nav-link">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span class="nav-text">Appointment</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{{ url_for('manage_blood_stock') }}" class="nav-link">
                            <i class="fa-solid fa-droplet"></i>
                            <span class="nav-text">Blood Stock</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{{ url_for('blood_request') }}" class="nav-link">
                            <i class="fa-solid fa-hand-holding-medical"></i>
                            <span class="nav-text">Blood Request</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{{ url_for('staff_report') }}" class="nav-link">
                            <i class="fa-solid fa-clipboard-question"></i>
                            <span class="nav-text">Report</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{{ url_for('make_announcement') }}" class="nav-link">
                            <i class="fa-solid fa-bullhorn"></i>
                            <span class="nav-text">Make Announcement</span>
                        </a>
                    </li>

                    <li class="nav-divider"></li>

                    <li class="nav-item">
                        <a href="{{ url_for('index') }}" class="nav-link login-link">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span class="nav-text">Log Out</span>
                        </a>
                    </li>

                </ul>
            </div>
        </div>

    </div>
</nav>

<main class="page-container">
    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
