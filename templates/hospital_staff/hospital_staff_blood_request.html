{% extends "hospital_staff/hospital_staff_base.html" %}
{% block title %}Blood Request{% endblock %}
{% block content %}

<div class="blood-request-container">

    <div class="blood-request-header">
        <h1>Blood Request</h1>
        <p>Please fill in the form below to request blood from the blood bank.</p>
    </div>

    <div class="blood-request-card">

        <div class="blood-request-intro">
            <div class="blood-request-icon">
                <i class="fa-solid fa-droplet"></i>
            </div>

            <div>
                <h2>Blood Request Form</h2>
                <p>Please provide the details of your blood request.</p>
            </div>
        </div>

        <form method="POST" action="{{ url_for('hospital_staff_blood_request') }}">

            <div class="request-form-group">
                <label for="hospital_name">Hospital Name</label>
                <input type="text"
                       id="hospital_name"
                       name="hospital_name"
                       placeholder="Enter your hospital name"
                       required>
            </div>

            <div class="request-form-group">
                <label for="blood_type">Blood Type</label>
                <select id="blood_type" name="blood_type" required>
                    <option value="">Select Blood Type</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div class="request-form-group">
                <label for="quantity">Quantity (Units)</label>
                <input type="number"
                       id="quantity"
                       name="quantity"
                       min="1"
                       placeholder="Enter number of units"
                       required>
            </div>

            <div class="request-form-group">
                <label for="reason">Reason for Request</label>
                <textarea id="reason"
                          name="reason"
                          rows="5"
                          placeholder="Explain why the blood is needed"
                          required></textarea>
            </div>

            <div class="request-form-actions">
                <button type="submit" class="submit-blood-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    Submit Blood Request
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
