{% extends "hospital_staff/hospital_staff_base.html" %}
{% block title %}Hospital Staff Dashboard{% endblock %}
{% block content %}

<div class="container py-4">

    <div class="dashboard-hero shadow-sm">
        <div class="row align-items-center">

            <div class="col-lg-7 p-4 p-lg-5">

                <span class="badge donor-badge mb-3">
                    <i class="fa-solid fa-hospital"></i>
                    Hospital Staff
                </span>

                <h1 class="fw-bold mb-3">
                    Welcome, Hospital Staff!
                </h1>

                <p class="hero-description mb-4">
                    Request blood from the blood bank and view submitted blood requests here .
                </p>

            </div>

            <div class="col-lg-5">
                <div class="hero-image-wrapper">
                    <img src="{{ url_for('static', filename='images/hospital_staff.jpg') }}"
                         class="img-fluid hero-image"
                         alt="Blood bank administration">
                </div>
            </div>

        </div>
    </div>

        <a href="{{ url_for('hospital_staff_blood_request') }}"
           class="request-blood-btn">
            <i class="fa-solid fa-droplet"></i>
            Request for Blood Now
        </a>
    </div>

</div>

{% endblock %}
