{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}

<div class="card">
    <div class="card-left">
        <img src="{{ url_for('static', filename='images/bloodbanklogin.jpg') }}" alt="Login picture">
    </div>

    <div class="card-right">
        <div class="form-container">
            <h2>Create an account</h2>
        </div>

        <form method="POST" action="{{ url_for('create_account') }}">
            <input type="hidden" name="next" value="{{ next }}">

            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Lee Chong Wei"required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="e.g. test@gmail.com"required>
            </div>

            <div class="input-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number" placeholder="e.g. 0123456789" required>
            </div>

            <div class="input-group">
                <label for="temp-password">Temporary Password</label>
                <input type="password" id="temp-password" name="temp-password" placeholder="e.g. password@123" required>
            </div>

            <div class="input-group">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="" disabled selected>Select a role...</option>
                    <option value="Blood Bank Staff">Blood Bank Staff</option>
                    <option value="Hospital Staff">Hospital Staff</option>
                </select>
            </div>

            <button type="submit" class="submit-button">Register</button>
        </form>
    </div>
</div>

{% if success_popup %}
<script>
    alert("{{ success_popup }}");
</script>
{% endif %}

{% if error_popup %}
<script>
    alert("{{ error_popup }}");
</script>
{% endif %}

{% endblock %}
