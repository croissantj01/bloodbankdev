{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="card">
    <div class="card-left">
        <img src="{{ url_for('static', filename='images/bloodbanklogin.jpg') }}" alt="Login picture">
    </div>

    <div class="card-right">
        <div class="form-container">
            <h2>Reset Password</h2>
        </div>

        <form method="POST" action="{{ url_for('check_email') }}">
            <div class="input-group">
                <label for="email">Enter the registered email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <button type="submit" class="submit-button">Find email</button>
        </form>

        <div class="input-group">
            <a href="{{ url_for('login') }}" class="reset-link">❮❮  Back</a>
        </div>
    </div>
</div>

{% if error_popup %}
<script>
    alert("{{ error_popup }}");
</script>
{% endif %}

{% endblock %}
