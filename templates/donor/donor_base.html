<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blood Bank{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

```html
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top nav-head">
    <div class="container">

        <a class="navbar-brand">
            ✦✧ Blood Bank Management System ✦✧
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#donorNav"
                aria-controls="donorNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="donorNav">

            <div class="floating-navbar">

                <ul class="navbar-nav">

                    <!-- HOME -->
                    <li class="nav-item">
                        <a href="{{ url_for('donor_dashboard') }}" class="nav-link">
                            <i class="fa-solid fa-house"></i>
                            <span class="nav-text">Home</span>
                        </a>
                    </li>


                    <!-- TEMPORARY REGISTRATION STATUS -->
                    {% set donor_registered = false %}


                    <!-- BEFORE REGISTRATION -->
                    {% if not donor_registered %}

                        <li class="nav-item">
                            <a href="{{ url_for('registration') }}" class="nav-link">
                                <i class="fa-solid fa-user-plus"></i>
                                <span class="nav-text">Register</span>
                            </a>
                        </li>

                    <!-- AFTER REGISTRATION -->
                    {% else %}

                        <li class="nav-item">
                            <a href="{{ url_for('manage_profile') }}" class="nav-link">
                                <i class="fa-solid fa-user"></i>
                                <span class="nav-text">Manage Profile</span>
                            </a>
                        </li>

                    {% endif %}


                    <!-- APPOINTMENT -->
                    <li class="nav-item">
                        <a href="{{ url_for('make_appointment') }}" class="nav-link">
                            <i class="fa-solid fa-calendar-check"></i>
                            <span class="nav-text">Appointment</span>
                        </a>
                    </li>
                    <!-- REWARDS -->
                    <li class="nav-item">
                        <a href="{{ url_for('rewards') }}" class="nav-link">
                            <i class="fa-solid fa-gift"></i>
                            <span class="nav-text">Rewards</span>
                        </a>
                    </li>
                    <!-- QUIZ -->
                    <li class="nav-item">
                        <a href="{{ url_for('donor_quiz') }}" class="nav-link">
                            <i class="fa-solid fa-circle-question"></i>
                            <span class="nav-text">Quiz</span>
                        </a>
                    </li>
                    <!-- FAQ -->
                    <li class="nav-item">
                        <a href="{{ url_for('donor_faq') }}" class="nav-link">
                            <i class="fa-solid fa-clipboard-question"></i>
                            <span class="nav-text">FAQ</span>
                        </a>
                    </li>


                    <!-- DIVIDER -->
                    <li class="nav-divider"></li>


                    <!-- LOG OUT -->
                    <li class="nav-item">
                        <a href="{{ url_for('index') }}" class="nav-link login-link">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span class="nav-text">Log Out</span>
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </div>
</nav>


<main class="page-container">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
