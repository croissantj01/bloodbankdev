{% extends "donor/donor_base.html" %}

{% block title %}Quiz{% endblock %}

{% block content %}
<div class="quiz-page-container">
    <div class="quiz-card">
        <div class="quiz-header">
            <h2>Blood Donor Eligibility</h2>

            <div class="quiz-progress">
                <div class="progress">
                    <span class="progress-bar"></span>
                </div>
            </div>
        </div>

        <hr class="quiz-divider">

        <div class="quiz-body">
            <div class="question-title" id="question-title">Question 1</div>
            <h3 class="question-text" id="question-text">Are you in the age group of 18-60 years old?</h3>

            <div class="options" id="options-container">
                <label class="option selected" id="option-yes">
                    <input type="radio" name="question1" value="yes" checked>
                    <span class="option-text">Yes</span>
                    <span class="custom-radio"></span>
                </label>

                <label class="option">
                    <input type="radio" name="question1" value="no" id="option-no">
                    <span class="option-text">No</span>
                    <span class="custom-radio"></span>
                </label>
            </div>
        </div>

        <div class="quiz-buttons">
            <button class="nav-button previous-button">
                <i class="fa-solid fa-arrow-left"></i> Previous
            </button>

            <button class="nav-button next-button">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
